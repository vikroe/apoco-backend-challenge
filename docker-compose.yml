services:
    db:
        image: postgres:18-alpine
        container_name: pokemon-db
        networks:
            - db-network
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pokemon-api
        environment:
            HOST: '0.0.0.0'
            PORT: '8080'
        networks:
            - db-network
        ports:
            - '8080:8080'
        restart: unless-stopped

networks:
    db-network:
