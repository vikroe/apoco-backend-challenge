x-api-env: &api-env
    API_HOST: 0.0.0.0
    API_PORT: ${API_PORT:-8080}
    MIKRO_ORM_HOST: db
    MIKRO_ORM_PORT: 5432
    MIKRO_ORM_USER: postgres
    MIKRO_ORM_PASSWORD: postgres
    MIKRO_ORM_DB_NAME: postgres
    MIKRO_ORM_DEBUG: 'false'
    JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-3600}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-300}
    OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-20000}

x-api-build: &api-build
    image: apoco-backend-challenge-api
    build:
        context: .
        dockerfile: Dockerfile

services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
            interval: 2s
            timeout: 5s
            retries: 20
        volumes:
            - pokemon-db-data:/var/lib/postgresql/data

    db-init:
        image: apoco-backend-challenge-api
        pull_policy: never
        depends_on:
            db:
                condition: service_healthy
        restart: 'no'
        environment:
            <<: *api-env
        command: ['yarn', 'db:init:prod']
        volumes:
            - ./resources:/app/resources:ro

    api:
        <<: *api-build
        depends_on:
            db-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy
        restart: unless-stopped
        environment:
            <<: *api-env
        ports:
            - '8080:${API_PORT:-8080}'

volumes:
    pokemon-db-data:
